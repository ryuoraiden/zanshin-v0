<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zanshin</title>
    <link rel="icon" href="../icons/icon32.png" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        padding: 22px 28px 60px;
      }
      .wrap {
        max-width: 1180px;
        margin: 0 auto;
      }
      header.top {
        margin-bottom: 20px;
      }
      .stats {
        display: grid;
        grid-template-columns: 1.6fr 1fr 1fr 1.3fr;
        gap: 12px;
        margin-bottom: 16px;
      }
      .stat .label {
        font-size: 12px;
        color: var(--muted);
      }
      .stat .value {
        font-size: 24px;
        font-weight: 600;
        margin: 2px 0 8px;
        font-variant-numeric: tabular-nums;
      }
      .stat .value small {
        font-size: 13px;
        color: var(--muted);
        font-weight: 500;
      }
      .grid {
        display: grid;
        grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr);
        gap: 16px;
        align-items: start;
      }
      .col > * + * {
        margin-top: 16px;
      }
      form .fields {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 12px;
      }
      form .span-6 {
        grid-column: span 6;
      }
      form .span-4 {
        grid-column: span 4;
      }
      form .span-3 {
        grid-column: span 3;
      }
      form .span-2 {
        grid-column: span 2;
      }
      .check {
        flex-direction: row !important;
        align-items: center;
        gap: 8px !important;
        color: var(--text) !important;
        font-size: 13px !important;
        padding-top: 22px;
      }
      .hint {
        font-size: 12px;
        color: var(--faint);
        margin-top: 8px;
      }
      .task-actions {
        display: flex;
        gap: 6px;
        flex-shrink: 0;
        align-items: flex-start;
      }
      .queue li .row.spread {
        align-items: flex-start;
        gap: 14px;
      }
      .queue li.group {
        padding: 0;
      }
      .group-head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 2px;
        cursor: pointer;
        user-select: none;
      }
      .group-head .caret {
        width: 14px;
        color: var(--muted);
        transition: transform 0.15s;
        flex-shrink: 0;
      }
      li.group.collapsed .caret {
        transform: rotate(-90deg);
      }
      .group-head .name {
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      .group-head .grow {
        flex: 1;
        min-width: 0;
      }
      .name-row {
        display: flex;
        align-items: baseline;
        gap: 10px;
      }
      .name-row .btn.link {
        font-size: 12px;
        padding: 0;
        opacity: 0.45;
        transition: opacity 0.12s;
      }
      .group-head:hover .name-row .btn.link,
      .name-row .btn.link:focus-visible {
        opacity: 1;
      }
      .rename {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }
      .rename input {
        max-width: 340px;
        padding: 5px 8px;
        font-size: 14px;
      }
      .group-body {
        list-style: none;
        margin: 0 0 8px 6px;
        padding: 0 0 0 14px;
        border-left: 2px solid var(--border-strong);
      }
      li.group.collapsed .group-body {
        display: none;
      }
      .group-body > li {
        padding: 9px 0;
        border-top: 1px solid var(--border);
      }
      .group-body > li:first-child {
        border-top: 0;
      }
      .series-ctl {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .series-ctl .btn.sm {
        padding: 2px 8px;
      }
      .queue li.pinned .item-title::before {
        content: '';
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
        margin-right: 8px;
        vertical-align: 2px;
      }
      .cat-row {
        display: grid;
        grid-template-columns: 70px 1fr 64px;
        gap: 10px;
        align-items: center;
        font-size: 13px;
        margin-bottom: 8px;
      }
      .week {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      .week td,
      .week th {
        padding: 6px 4px;
        text-align: left;
        border-top: 1px solid var(--border);
      }
      .week th {
        font-weight: 500;
        color: var(--muted);
        font-size: 12px;
        border-top: 0;
      }
      .week td.num,
      .week th.num {
        text-align: right;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        width: 1%;
        padding-left: 10px;
      }
      .week .bar {
        height: 8px;
      }
      .week tr.today td:first-child {
        color: var(--accent);
        font-weight: 600;
      }
      details summary {
        cursor: pointer;
        color: var(--muted);
        font-size: 13px;
      }
      .events {
        font-size: 12px;
        color: var(--faint);
        margin-top: 4px;
      }
      @media (max-width: 900px) {
        .grid,
        .stats {
          grid-template-columns: 1fr;
        }
        body {
          padding: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="top row spread">
        <div class="brand">
          <img class="logo" src="../icons/brand.png" alt="残心" />
          <span class="word">Zanshin</span>
        </div>
        <div class="row">
          <span class="small faint"><kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>Z</kbd> opens this page</span>
          <button class="btn ghost sm" id="opts" type="button">Options</button>
        </div>
      </header>
      <div id="setup"></div>
      <section class="stats" id="stats"></section>
      <div class="grid">
        <div class="col" id="left">
          <div id="session"></div>
          <section class="card queue">
            <div class="row spread" style="margin-bottom: 10px">
              <h3 style="margin: 0">Queue</h3>
              <span class="small faint" id="queue-count"></span>
            </div>
            <ul class="list" id="queue"></ul>
          </section>
          <section class="card">
            <h3 id="form-title">Add a task</h3>
            <form id="task-form" autocomplete="off">
              <div class="fields">
                <label class="field span-6">Title
                  <input type="text" name="title" placeholder="MLT Week 3, Lecture 2" required maxlength="200" />
                </label>
                <label class="field span-2">Category
                  <select name="category">
                    <option>IITM</option>
                    <option>DSA</option>
                    <option>NITC</option>
                    <option>Cyber</option>
                  </select>
                </label>
                <label class="field span-2">Type
                  <select name="type">
                    <option value="video">Lecture (video)</option>
                    <option value="codeforces">Codeforces</option>
                    <option value="manual" selected>Manual</option>
                  </select>
                </label>
                <label class="field span-2">Estimate (min)
                  <input type="number" name="estimateMin" min="0" max="600" step="5" placeholder="45" />
                </label>
                <label class="field span-4">URL
                  <input type="text" name="url" placeholder="https://www.youtube.com/watch?v=..." />
                </label>
                <label class="field span-2" id="cf-field">Codeforces problem
                  <input type="text" name="cfProblem" placeholder="580A" />
                </label>
                <label class="field span-3">Deadline
                  <input type="datetime-local" name="deadline" />
                </label>
                <label class="field check span-3">
                  <input type="checkbox" name="hardDeadline" /> Hard deadline (graded, can't slip)
                </label>
                <label class="field span-3">Group
                  <input type="text" name="group" list="group-names" placeholder="MAD2 Week 3, CP-31 1200..." maxlength="80" />
                </label>
                <label class="field span-3">Extra allowed sites for this task
                  <input type="text" name="extraDomains" placeholder="cp-algorithms.com, docs.python.org" />
                </label>
              </div>
              <datalist id="group-names"></datalist>
              <div class="hint" id="type-hint"></div>
              <div class="row" style="margin-top: 14px">
                <button class="btn primary" type="submit" id="submit">Add task</button>
                <button class="btn ghost hidden" type="button" id="cancel-edit">Cancel</button>
              </div>
            </form>
          </section>
          <section class="card">
            <h3>Paste links</h3>
            <form id="paste-form" autocomplete="off">
              <label class="field">
                One per line. A title before the link is kept ("POTD | https://codeforces.com/..."), and a bare
                Codeforces code like 2001C works too.
                <textarea name="lines" rows="5" spellcheck="false" placeholder="https://codeforces.com/contest/2001/problem/C&#10;Two Sum | https://leetcode.com/problems/two-sum/&#10;https://youtu.be/..."></textarea>
              </label>
              <div class="fields" style="margin-top: 12px">
                <label class="field span-3">Group
                  <input type="text" name="group" list="group-names" placeholder="no group" maxlength="80" />
                </label>
                <label class="field span-3">Category
                  <select name="category">
                    <option value="">From the link</option>
                    <option>IITM</option>
                    <option>DSA</option>
                    <option>NITC</option>
                    <option>Cyber</option>
                  </select>
                </label>
                <label class="field check span-6" style="padding-top: 0">
                  <input type="checkbox" name="series" /> Feed
                  <input type="number" name="batch" min="1" max="10" value="3" style="width: 64px" />
                  at a time as a series (named after the group)
                </label>
              </div>
              <div class="hint" id="paste-hint">Codeforces links become Codeforces tasks that finish themselves on an accepted submission. YouTube links become lectures.</div>
              <div class="row" style="margin-top: 12px">
                <button class="btn primary" type="submit" id="paste-submit">Add links</button>
              </div>
            </form>
          </section>
        </div>
        <div class="col" id="right"></div>
      </div>
    </div>
    <script type="module" src="dashboard.js"></script>
  </body>
</html>
